<!DOCTYPE html>
<html lang="en">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">


<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOFT COMPUTACIÓN</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
</head>

<body>
    <div id="app">

        <div id="splash-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #ffffff; z-index: 9999;">
            <img src="img/logo.png" alt="Logo Loft Computación" style="width: 250px; height: auto;" />
            <p style="margin-top: 15px; font-weight: bold; color: #555;">Cargando sistema...</p>
        </div>

        <div id="blazor-root" style="display: none;"></div>

    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script>
        // Define la duración deseada para el splash screen (1000ms = 1 segundo)
        const splashDuration = 1500;

        // Función que oculta el splash y llama a Blazor.start()
        function startApplication() {
            // 1. Oculta la pantalla de carga
            document.getElementById('splash-screen').style.display = 'none';
            // 2. Muestra el contenedor de Blazor
            document.getElementById('blazor-root').style.display = 'block';

            // 3. Llama a la función de inicio nativa de Blazor
            Blazor.start({
                // Configuración para el contenedor donde Blazor debe renderizar
                configureContainer: (builder) => {
                    builder.getServices().getRequiredService(DotNet.Runtime.WebAssemblyHost).main = () => {
                        return new Promise((resolve) => {
                            setTimeout(() => {
                                resolve();
                            }, 0);
                        };
                    });
        }
                });
            }

        // Retrasar la llamada a startApplication por la duración deseada
        setTimeout(startApplication, splashDuration);

    </script>

    <script src="_framework/blazor.webassembly.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }
    </script>
</body>
</html>
