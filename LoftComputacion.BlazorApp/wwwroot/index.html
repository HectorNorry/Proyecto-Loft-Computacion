<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOFT COMPUTACIÓN</title>

    <base href="/" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">

    <link rel="stylesheet" href="css/app.css" />
    <link rel="manifest" href="manifest.json">

    <!-- Meta tags PWA -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="img/logo.png">
    <link rel="icon" type="image/png" href="img/logo.png">
</head>
<body class="bg-light">

    <!-- Loader estándar de Blazor -->
    <div id="app" class="d-flex flex-column align-items-center justify-content-center vh-100 text-center">
        <!-- Logo opcional: si lo querés, lo dejamos aquí -->
        <!-- <img src="img/logo.png" alt="Loft Computación"
             style="width:120px;height:auto;" class="mb-3"> -->

        <svg class="loading-progress mb-3">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>

        <div class="loading-progress-text fw-bold text-primary">Cargando aplicación...</div>
    </div>

    <!-- Error UI -->
    <div id="blazor-error-ui" class="alert alert-danger alert-dismissible fade show position-fixed bottom-0 start-0 m-3" role="alert">
        Ha ocurrido un error inesperado.
        <a href="" class="reload alert-link">Recargar</a>
        <button type="button" class="btn-close dismiss" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Blazor WASM -->
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            const isLocalhost = Boolean(
                window.location.hostname === 'localhost' ||
                window.location.hostname === '127.0.0.1'
            );

            const swFile = isLocalhost ? 'service-worker.js' : 'service-worker.published.js';
            navigator.serviceWorker.register(swFile).then(() => {
                console.log(`Service Worker registrado: ${swFile}`);
            });
        }
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
</body>
</html>
